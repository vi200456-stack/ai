<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지난 투표 결과</title>
<meta name="description" content="투표가 끝난 제품의 최종 결과예요.">
<meta property="og:type" content="website">
<meta property="og:title" content="지난 투표 결과">
<meta property="og:description" content="투표가 끝난 제품의 최종 결과예요.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%81%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --primary: #d2691e;
    --ink: #1d1d1f;
    --ink-muted: #6e6e73;
    --canvas: #ffffff;
    --parchment: #faf6f1;
    --hairline: #e8e2da;
    --shadow: rgba(80, 50, 20, 0.08) 0 4px 16px 0;
    --font: "SF Pro Text", system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body { font-family: var(--font); background: var(--parchment); color: var(--ink); min-height: 100vh; line-height: 1.4; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 20px 64px; }

  .back { display: inline-block; font-size: 14px; font-weight: 700; color: var(--primary); text-decoration: none; margin-bottom: 14px; }
  header { text-align: center; margin-bottom: 22px; }
  header .emoji { font-size: 40px; }
  header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.4px; margin-top: 6px; }
  header p { margin-top: 6px; color: var(--ink-muted); font-size: 14px; }

  .search {
    display: flex; align-items: center; gap: 8px;
    background: var(--canvas); border: 1.5px solid var(--hairline); border-radius: 14px;
    padding: 0 12px; margin-bottom: 8px;
  }
  .search:focus-within { border-color: var(--primary); }
  .search input {
    flex: 1; border: none; outline: none; background: transparent;
    font-family: var(--font); font-size: 16px; padding: 13px 0; color: var(--ink);
  }
  .search button { border: none; background: none; color: #b0a89f; font-size: 16px; cursor: pointer; padding: 4px; }
  .hint { font-size: 13px; color: var(--ink-muted); margin: 0 2px 14px; }

  .item {
    background: var(--canvas); border: 1px solid var(--hairline); border-radius: 18px;
    padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow);
  }
  .ih { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .ih b { font-size: 18px; letter-spacing: -0.3px; }
  .badge { font-size: 12px; font-weight: 800; background: #e3f3e7; color: #227a3a; border-radius: 7px; padding: 3px 8px; white-space: nowrap; }
  .src { display: inline-block; font-size: 12.5px; font-weight: 700; color: #5b4b3b; background: #f3ede4; border-radius: 7px; padding: 3px 9px; margin: 2px 0 6px; }
  .meta { font-size: 13px; color: var(--ink-muted); margin-bottom: 12px; }
  .win { background: #fffaf2; border-radius: 12px; padding: 10px 12px; font-size: 14px; line-height: 1.5; }
  .win .t { color: var(--primary); font-weight: 800; }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .actions button, .actions a {
    flex: 1; text-align: center; text-decoration: none; cursor: pointer;
    font-family: var(--font); font-size: 14px; font-weight: 700; border-radius: 10px; padding: 10px;
  }
  .actions button { background: var(--primary); color: #fff; border: none; }
  .actions a { background: var(--canvas); color: var(--primary); border: 1.5px solid var(--primary); }
  .img { margin-top: 12px; }
  .img img { width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--hairline); display: block; }
  mark { background: #ffe08a; border-radius: 3px; padding: 0 1px; color: inherit; }
  .empty { text-align: center; color: var(--ink-muted); font-size: 14px; padding: 30px 0; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/">‹ 투표하러 가기</a>
    <header>
      <div class="emoji">📁</div>
      <h1>지난 투표 결과</h1>
      <p>투표가 끝난 제품의 최종 결과예요.</p>
    </header>

    <div class="search">
      <span>🔍</span>
      <input type="search" id="q" placeholder="제품명 또는 후보 이름 검색" autocomplete="off">
      <button type="button" id="clear" aria-label="검색어 지우기" hidden>✕</button>
    </div>
    <div class="hint" id="hint"></div>
    <div id="list"></div>
  </div>

<script>
  // 마감된 투표의 최종 결과. DB 테이블을 지워도 남도록 결과는 이미지 파일(/results/*.png)로 보관한다.
  // 새 투표를 마감하면 결과 이미지를 이 폴더에 추가하고 아래 목록에 한 줄 추가하면 된다.
  const ARCHIVE = [
    {
      title: '산적구이 재투표 (중단)',
      period: '2026.10.27(화)',
      total: 16,
      winners: ['실속 산적구이'],
      winnerVotes: 10,
      winLabel: '중단 시점 1위',
      badge: '투표 중단',
      note: '→ 후보가 바뀌어 중단, 새 후보로 다시 투표',
      candidates: ['실속 산적구이', '산도적도 반할 산적구이'],
      source: '상품기획팀',
      image: '/results/sanjeok-2.png?v=2',
      file: '산적구이_재투표_중단_결과.png',
    },
    {
      title: '산적구이 (1차)',
      period: '2026.10.26(월) ~ 10.27(화)',
      total: 23,
      winners: ['실속 산적구이', '산도적도 반할 산적구이'],
      winnerVotes: 6,
      note: '→ 동점으로 두 후보 재투표 진행',
      candidates: ['실속 산적구이', '맛있는 산적구이', '불고기맛 산적구이', '더 큰 산적구이',
                   '알찬 산적구이', '산도적도 반할 산적구이'],
      source: '상품기획팀',
      image: '/results/sanjeok-1.png?v=2',
      file: '산적구이_1차_제품명_투표결과.png',
    },
    {
      title: '어묵탕',
      period: '2026.10.26(월) ~ 10.27(화)',
      total: 29,
      winners: ['심야포차 어묵탕'],
      winnerVotes: 8,
      candidates: ['깊은맛 모둠 어묵탕', '진국 모둠 어묵탕', '따끈한 하루 어묵탕', '어묵엔 국물',
                   '탱글 한 그릇 어묵탕', '심야포차 어묵탕', '부산 진국 어묵탕', '부산 포차 어묵탕'],
      source: '상품기획팀',
      image: '/results/eomuk.png?v=2',
      file: '어묵탕_제품명_투표결과.png',
    },
  ];

  const qEl = document.getElementById('q');
  const clearEl = document.getElementById('clear');

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // 검색어와 일치하는 부분을 형광펜으로 표시
  function hl(text, q) {
    const t = escapeHtml(text);
    if (!q) return t;
    const i = text.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return t;
    return escapeHtml(text.slice(0, i)) + '<mark>' + escapeHtml(text.slice(i, i + q.length)) + '</mark>' + escapeHtml(text.slice(i + q.length));
  }

  function render() {
    const q = qEl.value.trim();
    clearEl.hidden = !q;
    const items = ARCHIVE.filter(a => !q ||
      [a.title, ...a.candidates].some(s => s.toLowerCase().includes(q.toLowerCase())));

    document.getElementById('hint').textContent = q
      ? '검색 결과 ' + items.length + '건 (전체 ' + ARCHIVE.length + '건)'
      : '전체 ' + ARCHIVE.length + '건';

    const list = document.getElementById('list');
    if (items.length === 0) {
      list.innerHTML = '<div class="empty">검색 결과가 없어요.</div>';
      return;
    }
    list.innerHTML = items.map((a, idx) => {
      const matched = q ? a.candidates.filter(c => c.toLowerCase().includes(q.toLowerCase()) && !a.winners.includes(c)) : [];
      return '<div class="item">' +
        '<div class="ih"><b>' + hl(a.title, q) + '</b><span class="badge">' + escapeHtml(a.badge || '투표 마감') + '</span></div>' +
        (a.source ? '<div class="src">📝 네이밍: ' + escapeHtml(a.source) + '</div>' : '') +
        '<div class="meta">' + escapeHtml(a.period) + ' · 총 ' + a.total + '표</div>' +
        '<div class="win"><span class="t">🏆 ' + (a.winLabel || (a.winners.length > 1 ? '공동 1위' : '1위')) + ' (' + (a.winners.length > 1 ? '각 ' : '') + a.winnerVotes + '표)</span><br>' +
          a.winners.map(w => hl(w, q)).join(' · ') +
          (a.note ? '<br><span style="color:#c2410c;font-weight:700">' + escapeHtml(a.note) + '</span>' : '') +
          (matched.length ? '<br><span style="color:var(--ink-muted);font-size:13px">검색된 후보: ' + matched.map(m => hl(m, q)).join(', ') + '</span>' : '') +
        '</div>' +
        '<div class="actions">' +
          '<button type="button" data-i="' + idx + '">결과 이미지 보기</button>' +
          '<a href="' + a.image + '" download="' + escapeHtml(a.file) + '">이미지 저장</a>' +
        '</div>' +
        '<div class="img" hidden><img src="' + a.image + '" alt="' + escapeHtml(a.title) + ' 투표 결과" loading="lazy"></div>' +
      '</div>';
    }).join('');

    list.querySelectorAll('button[data-i]').forEach(btn => {
      btn.onclick = () => {
        const box = btn.closest('.item').querySelector('.img');
        box.hidden = !box.hidden;
        btn.textContent = box.hidden ? '결과 이미지 보기' : '이미지 접기';
      };
    });
  }

  qEl.addEventListener('input', render);
  clearEl.addEventListener('click', () => { qEl.value = ''; render(); qEl.focus(); });
  render();
</script>
</body>
</html>
