<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제품명 투표</title>
<meta name="description" content="제품별로 가장 끌리는 이름을 하나씩 골라주세요.">
<meta property="og:type" content="website">
<meta property="og:title" content="제품명 투표">
<meta property="og:description" content="제품별로 가장 끌리는 이름을 하나씩 골라주세요.">
<meta property="og:url" content="https://ai-tcs3.vercel.app/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --primary: #d2691e;
    --primary-dark: #b4560f;
    --ink: #1d1d1f;
    --ink-muted: #6e6e73;
    --canvas: #ffffff;
    --parchment: #faf6f1;
    --hairline: #e8e2da;
    --leader: #ffbf47;
    --danger: #c0392b;
    --shadow: rgba(80, 50, 20, 0.10) 0 6px 24px 0;
    --font: "SF Pro Text", system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    font-family: var(--font);
    background: var(--parchment);
    color: var(--ink);
    min-height: 100vh;
    line-height: 1.4;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 32px 20px 64px; }

  header { text-align: center; margin-bottom: 28px; }
  header .emoji { font-size: 44px; }
  header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.4px; margin-top: 8px; }
  header p { margin-top: 8px; color: var(--ink-muted); font-size: 15px; letter-spacing: -0.2px; }

  .card {
    background: var(--canvas);
    border: 1px solid var(--hairline);
    border-radius: 20px;
    padding: 22px;
    box-shadow: var(--shadow);
  }

  .field { margin-bottom: 20px; }
  .field label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; letter-spacing: -0.2px; }
  .field input[type="text"] {
    width: 100%;
    font-family: var(--font); font-size: 17px; letter-spacing: -0.3px;
    color: var(--ink);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    padding: 13px 14px;
    background: var(--canvas);
  }
  .field input[type="text"]:focus { outline: 2px solid var(--primary); outline-offset: 0; border-color: transparent; }

  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  .opt {
    display: flex; align-items: flex-start; gap: 12px;
    border: 1.5px solid var(--hairline);
    border-radius: 14px;
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
    background: var(--canvas);
    text-align: left;
    width: 100%;
    font-family: var(--font);
  }
  .opt:active { transform: scale(0.99); }
  .opt .radio {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--hairline);
    flex-shrink: 0; position: relative;
    transition: border-color 0.15s ease;
    margin-top: 1px;
  }
  .opt-body { display: flex; flex-direction: column; gap: 4px; }
  .opt.selected { border-color: var(--primary); background: #fff8f1; }
  .opt.selected .radio { border-color: var(--primary); }
  .opt.selected .radio::after { content: ''; position: absolute; inset: 4px; background: var(--primary); border-radius: 50%; }
  .opt .name { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }
  .opt .num { color: var(--ink-muted); font-size: 13px; margin-right: 2px; }
  .opt .desc { font-size: 13px; line-height: 1.5; color: var(--ink-muted); letter-spacing: -0.2px; }

  .btn {
    width: 100%;
    background: var(--primary); color: #fff; border: none;
    font-family: var(--font); font-size: 17px; font-weight: 600;
    letter-spacing: -0.3px;
    border-radius: 9999px; padding: 15px;
    cursor: pointer; transition: transform 0.1s ease, background 0.15s ease;
  }
  .btn:hover { background: var(--primary-dark); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.45; cursor: default; transform: none; }

  .revote {
    background: #fff6ef; border: 1.5px dashed #f2a774; border-radius: 12px;
    padding: 12px 14px; font-size: 13.5px; line-height: 1.6; color: #7a3b10; margin-bottom: 18px;
  }
  .revote b { color: #c2410c; }
  .guide {
    background: #f4f7ff; border: 1.5px solid #b9cdf5; border-radius: 12px;
    padding: 11px 13px; font-size: 13.5px; line-height: 1.55; color: #1f3f8a; margin-bottom: 18px;
  }
  .guide span { color: #5a6f9f; font-size: 12.5px; }
  .donebox {
    background: #eef8f1; border: 1.5px solid #a8dcb6; border-radius: 12px;
    padding: 10px 13px; font-size: 13.5px; line-height: 1.5; color: #1f5f33; margin-bottom: 16px;
  }
  .donebox b { color: #227a3a; }
  .err { color: var(--danger); font-size: 14px; margin-top: 12px; text-align: center; letter-spacing: -0.2px; white-space: pre-wrap; }

  .results { display: none; }
  .results.show { display: block; }
  .form-view.hide { display: none; }

  .result-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  .result-head h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-muted); font-weight: 600; }
  .live .dot { width: 8px; height: 8px; border-radius: 50%; background: #34c759; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .total { color: var(--ink-muted); font-size: 14px; margin-bottom: 20px; }

  .bar-row { margin-bottom: 16px; }
  .bar-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; gap: 10px; }
  .bar-name { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
  .rank {
    display: inline-block; min-width: 34px; text-align: center;
    font-size: 12px; font-weight: 700; color: #fff; background: var(--ink-muted);
    border-radius: 9999px; padding: 2px 8px; margin-right: 8px; vertical-align: middle;
  }
  .bar-row.leader .rank { background: var(--primary); }
  .rank.rank-none { background: transparent; color: var(--ink-muted); font-weight: 400; }
  .bar-val { font-size: 14px; color: var(--ink-muted); white-space: nowrap; }
  .bar-track { height: 26px; background: #f1ece5; border-radius: 8px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--primary); border-radius: 8px; width: 0%; transition: width 0.5s cubic-bezier(0.16,1,0.3,1); min-width: 2px; }
  .bar-row.leader .bar-fill { background: linear-gradient(90deg, var(--primary), var(--leader)); }
  .bar-row.mychoice .bar-name::after {
    content: '내 선택'; font-size: 11px; color: var(--primary);
    background: #fff1e3; border-radius: 6px; padding: 2px 6px; margin-left: 6px;
    font-weight: 600; vertical-align: middle;
  }

  .voters { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--hairline); }
  .voters h3 { font-size: 14px; color: var(--ink); margin-bottom: 12px; font-weight: 600; }
  .admin-tag { font-size: 11px; color: var(--primary); background: #fff1e3; border-radius: 6px; padding: 2px 6px; font-weight: 600; margin-left: 4px; }
  .voter-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .voter-chip { background: var(--parchment); border: 1px solid var(--hairline); border-radius: 9999px; padding: 6px 12px; font-size: 13px; letter-spacing: -0.2px; }
  .voter-chip b { font-weight: 600; }
  .voter-chip .c { color: var(--primary); font-weight: 600; }
  .voters-empty { color: var(--ink-muted); font-size: 14px; }

  .admin-banner { background: #fff1e3; border: 1px solid #ffd8ad; color: #7a4b00; border-radius: 12px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; text-align: center; font-weight: 600; }

  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab {
    flex: 1; font-family: var(--font); font-size: 16px; font-weight: 600; letter-spacing: -0.3px;
    color: var(--ink-muted); background: var(--canvas);
    border: 1.5px solid var(--hairline); border-radius: 14px;
    padding: 12px 10px; cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .tab.active { color: var(--primary); border-color: var(--primary); background: #fff8f1; }
  .tab-title { display: block; }
  .tab-status { display: block; font-size: 12px; font-weight: 600; color: var(--ink-muted); margin-top: 2px; }
  .tab-status.done { color: #34a853; }

  .golink {
    display: block; margin-top: 16px; text-align: center; text-decoration: none;
    background: var(--canvas); border: 1.5px solid var(--hairline); border-radius: 14px;
    padding: 14px; font-size: 15px; font-weight: 700; color: #5b4b3b;
  }
  footer { text-align: center; color: var(--ink-muted); font-size: 12px; margin-top: 28px; letter-spacing: -0.1px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="emoji">🍽️</div>
      <h1>제품명 투표</h1>
      <p>제품별로 가장 끌리는 이름을 하나씩 골라주세요.</p>
    </header>

    <div class="tabs" id="tabs"></div>

    <div class="card form-view" id="formView">
      <div class="revote" id="revoteNote" hidden></div>

      <div class="guide">📌 결과는 <b>투표한 기기·앱(브라우저)</b>에서만 다시 볼 수 있어요.<br><span>다른 폰·노트북, 다른 브라우저, 시크릿 창에선 안 보여요.</span></div>

      <div class="field">
        <label for="voterName">이름</label>
        <input type="text" id="voterName" placeholder="투표자 이름을 입력하세요" maxlength="40" autocomplete="off">
      </div>

      <div class="field">
        <label>후보 제품명</label>
        <div class="options" id="options"></div>
      </div>


      <button class="btn" id="submitBtn" onclick="submitVote()">투표 확인하기</button>
      <div class="err" id="formErr"></div>
    </div>

    <div class="card results" id="results">
      <div class="donebox" id="doneBox" hidden>✅ <b>투표 완료!</b> 결과는 이 기기·이 앱에서만 다시 볼 수 있어요.</div>
      <div class="result-head">
        <h2 id="resultTitle">실시간 투표 결과</h2>
        <span class="live"><span class="dot"></span>LIVE</span>
      </div>
      <div class="total" id="totalLine">집계 중...</div>
      <div id="bars"></div>

      <div class="voters" id="votersBox" hidden>
        <h3>🔒 참여자 명단 <span class="admin-tag">관리자 전용</span></h3>
        <div class="voter-list" id="voterList"></div>
      </div>
    </div>

    <a class="golink" href="/results/">📁 지난 투표 결과 보기 ›</a>

    <footer>투표는 이름당 한 번만 가능하며 변경할 수 없습니다.</footer>
  </div>

<script>
  // 진행 중인 투표 목록. 키와 후보 개수는 api/vote.js 의 POLLS 와 반드시 일치해야 합니다.
  // 마감된 투표(어묵탕)는 여기서 빼고, 결과는 /results 페이지에 이미지로 보관합니다.
  const POLLS = {
    sanjeok2: {
      title: '산적구이 재투표',
      storageKey: 'sanjeok2_vote_v1',
      // 재투표 안내 (투표 화면 맨 위에 표시)
      revoteNote: '1차 투표(10/26~10/27)에서 <b>실속 산적구이</b>와 <b>산도적도 반할 산적구이</b>가 각 6표로 <b>동점</b>이 나와, 두 후보로 다시 투표합니다.<br>1차 투표 참여 여부와 관계없이 <b>모두 다시 투표</b>해 주세요.',
      options: [
        { name: '실속 산적구이', desc: '1차 투표 공동 1위' },
        { name: '산도적도 반할 산적구이', desc: '1차 투표 공동 1위' },
      ],
    },
  };
  // 예전 링크(?poll=sanjeok)로 들어와도 재투표 탭이 열리게 함
  const POLL_ALIASES = { sanjeok: 'sanjeok2' };
  const POLL_IDS = Object.keys(POLLS);
  const NAME_KEY = 'voter_name';

  const params = new URLSearchParams(location.search);
  // 관리자 키: 주소에 ?key=... 가 있으면 관리자로 간주 (서버가 실제 검증)
  const ADMIN_KEY = params.get('key') || '';
  // 주소에 ?poll= 이 있으면 그 탭, 없으면 초기화 때 정함(투표한 탭 우선)
  const requestedPoll = POLL_ALIASES[params.get('poll')] || params.get('poll');
  let currentPoll = POLLS[requestedPoll] ? requestedPoll : null;
  let selected = null;
  let myChoice = null;
  let pollTimer = null;

  function poll() { return POLLS[currentPoll]; }
  function btnLabel() { return poll().revoteNote ? '재투표 확인하기' : '투표 확인하기'; }

  // GET 요청 URL (관리자면 key 붙여서 이름까지 받아옴)
  function tallyUrl(id) {
    let u = '/api/vote?poll=' + encodeURIComponent(id);
    if (ADMIN_KEY) u += '&key=' + encodeURIComponent(ADMIN_KEY);
    return u;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // 투표 기록은 localStorage 와 쿠키 두 곳에 남긴다.
  // 앱(카톡 등)이 한쪽을 지워도 다른 쪽이 남아 있으면 결과가 계속 보이게 하려는 것.
  const COOKIE_MAX_AGE = 60 * 60 * 24 * 365;

  function getCookie(key) {
    const m = document.cookie.match(new RegExp('(?:^|; )' + key + '=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : null;
  }

  function setCookie(key, value) {
    try {
      document.cookie = key + '=' + encodeURIComponent(value) +
        '; max-age=' + COOKIE_MAX_AGE + '; path=/; SameSite=Lax' +
        (location.protocol === 'https:' ? '; Secure' : '');
    } catch (e) {}
  }

  function loadLocal(id) {
    const key = POLLS[id].storageKey;
    let saved = null;
    try {
      const raw = localStorage.getItem(key);
      saved = raw ? JSON.parse(raw) : null;
    } catch (e) {}
    const c = getCookie(key);
    if (!saved && c) {
      // localStorage 가 지워졌지만 쿠키가 남은 경우 → 쿠키로 복구
      saved = { name: null, choice: Number(c) || null, voted: true };
      try { localStorage.setItem(key, JSON.stringify(saved)); } catch (e) {}
    } else if (saved && !c) {
      // 반대로 쿠키만 지워진 경우 → 쿠키 다시 남김
      setCookie(key, saved.choice || 'v');
    }
    return saved;
  }

  function saveLocal(id, name, choice) {
    const key = POLLS[id].storageKey;
    try {
      localStorage.setItem(key, JSON.stringify({ name, choice, voted: true }));
      localStorage.setItem(NAME_KEY, name);
    } catch (e) {}
    setCookie(key, choice || 'v');
  }

  function hasVoted(id) {
    const saved = loadLocal(id);
    return !!(saved && (saved.voted || saved.choice));
  }

  // ---- 탭 ----
  function renderTabs() {
    const tabs = document.getElementById('tabs');
    tabs.innerHTML = '';
    POLL_IDS.forEach(id => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tab' + (id === currentPoll ? ' active' : '');
      b.innerHTML = '<span class="tab-title">' + escapeHtml(POLLS[id].title) + '</span>' +
        (hasVoted(id)
          ? '<span class="tab-status done">✔ 투표 완료</span>'
          : '<span class="tab-status">투표 전</span>');
      b.onclick = () => switchPoll(id);
      tabs.appendChild(b);
    });
  }

  function switchPoll(id) {
    if (id === currentPoll) return;
    currentPoll = id;
    // 주소창도 현재 탭으로 맞춰서, 새로고침하거나 공유해도 같은 탭이 열리게 함
    const p = new URLSearchParams(location.search);
    p.set('poll', id);
    history.replaceState(null, '', location.pathname + '?' + p.toString());
    openPoll();
  }

  // 현재 탭을 그린다: 투표한 탭(또는 관리자)은 결과만, 아니면 투표 화면
  function openPoll() {
    stopPolling();
    selected = null;
    const saved = loadLocal(currentPoll);
    myChoice = saved && saved.choice ? saved.choice : null;

    renderTabs();
    document.getElementById('formErr').textContent = '';
    const btn = document.getElementById('submitBtn');
    btn.disabled = false;
    btn.textContent = btnLabel();
    const note = document.getElementById('revoteNote');
    note.hidden = !poll().revoteNote;
    note.innerHTML = poll().revoteNote ? '🔁 <b>재투표 안내</b><br>' + poll().revoteNote : '';
    document.getElementById('resultTitle').textContent = '실시간 투표 결과 · ' + poll().title;
    document.getElementById('totalLine').textContent = '집계 중...';
    document.getElementById('bars').innerHTML = '';
    document.getElementById('votersBox').hidden = true;

    renderOptions();

    if (ADMIN_KEY || hasVoted(currentPoll)) {
      showResults(null);
    } else {
      document.getElementById('results').classList.remove('show');
      document.getElementById('formView').classList.remove('hide');
    }
  }

  function renderOptions() {
    const optionsEl = document.getElementById('options');
    optionsEl.innerHTML = '';
    poll().options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'opt';
      btn.innerHTML =
        '<span class="radio"></span>' +
        '<span class="opt-body">' +
          '<span class="name"><span class="num">' + (i + 1) + '.</span>' + escapeHtml(opt.name) + '</span>' +
          (opt.desc ? '<span class="desc">' + escapeHtml(opt.desc) + '</span>' : '') +
        '</span>';
      btn.onclick = () => selectOption(i + 1, btn);
      optionsEl.appendChild(btn);
    });
  }

  function selectOption(choice, btn) {
    selected = choice;
    document.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
    btn.classList.add('selected');
    document.getElementById('formErr').textContent = '';
  }

  async function submitVote() {
    const id = currentPoll;
    const err = document.getElementById('formErr');
    const btn = document.getElementById('submitBtn');
    const voterName = document.getElementById('voterName').value.trim();
    err.textContent = '';

    if (!voterName) { err.textContent = '이름을 입력해주세요.'; return; }
    if (!selected) { err.textContent = '후보를 하나 선택해주세요.'; return; }

    const choice = selected;
    if (!confirm('"' + POLLS[id].options[choice - 1].name + '"에 투표할까요?\n\n한 번 투표하면 변경할 수 없어요.\n결과는 이 기기·이 앱에서만 다시 볼 수 있어요.')) {
      return;
    }

    btn.disabled = true;
    btn.textContent = '투표 확인 중...';

    try {
      const res = await fetch('/api/vote?poll=' + encodeURIComponent(id), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ poll: id, voterName, choice }),
      });
      const data = await res.json();

      if (res.status === 409) {
        // 이미 투표한 이름 → 결과는 보여주지 않음 (남의 이름으로 결과를 보는 것 방지).
        // 결과는 투표했던 브라우저에서만 보인다.
        err.textContent = '이미 투표한 이름입니다.\n투표했던 곳(카톡, 노트북, 사용한 브라우저 등)에서 다시 열면 결과를 볼 수 있어요.';
        btn.disabled = false;
        btn.textContent = btnLabel();
        return;
      }
      if (!res.ok) {
        err.textContent = data.error || '투표에 실패했어요. 잠시 후 다시 시도해주세요.';
        btn.disabled = false;
        btn.textContent = btnLabel();
        return;
      }

      saveLocal(id, voterName, choice);
      if (id === currentPoll) {
        myChoice = choice;
        renderTabs();
        showResults(data);
      }
    } catch (e) {
      err.textContent = '네트워크 오류가 발생했어요. 인터넷 연결을 확인해주세요.';
      btn.disabled = false;
      btn.textContent = btnLabel();
    }
  }

  // ---- 결과 ----
  function showResults(data) {
    document.getElementById('formView').classList.add('hide');
    document.getElementById('results').classList.add('show');
    // 투표한 사람에게만 "이 기기에서만 다시 볼 수 있다" 안내 (관리자 모드는 제외)
    document.getElementById('doneBox').hidden = !!ADMIN_KEY || !hasVoted(currentPoll);
    if (data) renderTally(data);
    startPolling();
  }

  function renderTally(data) {
    const options = poll().options;
    const counts = data.counts || Array(options.length).fill(0);
    const total = data.total || 0;
    const max = Math.max(1, ...counts);

    document.getElementById('totalLine').textContent = '총 ' + total + '표';

    // 득표순으로 정렬 (동점은 원래 순서 유지)
    const ranked = options.map((opt, i) => ({ name: opt.name, choice: i + 1, count: counts[i] || 0 }))
      .sort((a, b) => b.count - a.count || a.choice - b.choice);

    // 동점은 같은 등수로 계산
    let lastCount = null, lastRank = 0;
    ranked.forEach((r, idx) => {
      if (r.count !== lastCount) { lastRank = idx + 1; lastCount = r.count; }
      r.rank = total > 0 ? lastRank : null;
    });

    const bars = document.getElementById('bars');
    bars.innerHTML = '';
    ranked.forEach(r => {
      const pct = total > 0 ? Math.round((r.count / total) * 100) : 0;
      const widthPct = (r.count / max) * 100;

      const row = document.createElement('div');
      row.className = 'bar-row';
      if (r.rank === 1 && total > 0) row.classList.add('leader');
      if (r.choice === myChoice) row.classList.add('mychoice');

      const rankBadge = r.rank ? '<span class="rank">' + r.rank + '위</span>' : '<span class="rank rank-none">-</span>';

      row.innerHTML =
        '<div class="bar-top">' +
          '<span class="bar-name">' + rankBadge + escapeHtml(r.name) + '</span>' +
          '<span class="bar-val">' + r.count + '표 · ' + pct + '%</span>' +
        '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + widthPct + '%"></div></div>';
      bars.appendChild(row);
    });

    renderVoters(data.voters);
  }

  // 관리자(서버가 voters를 내려준 경우)에게만 이름 명단 표시
  function renderVoters(voters) {
    const box = document.getElementById('votersBox');
    if (!voters) { box.hidden = true; return; }
    box.hidden = false;
    const options = poll().options;
    const list = document.getElementById('voterList');
    if (voters.length === 0) {
      list.innerHTML = '<span class="voters-empty">아직 참여자가 없습니다.</span>';
      return;
    }
    list.innerHTML = voters.map(v =>
      '<span class="voter-chip"><b>' + escapeHtml(v.name) + '</b> → <span class="c">' +
      (options[v.choice - 1] ? escapeHtml(options[v.choice - 1].name) : (v.choice + '번')) + '</span></span>'
    ).join('');
  }

  function startPolling() {
    refresh();
    stopPolling();
    pollTimer = setInterval(refresh, 4000);
  }

  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  async function refresh() {
    const id = currentPoll;
    try {
      const res = await fetch(tallyUrl(id), { method: 'GET' });
      const data = await res.json();
      if (id !== currentPoll) return; // 응답이 오기 전에 탭을 바꾼 경우 무시
      if (!res.ok) {
        document.getElementById('totalLine').textContent = '⚠️ ' + (data.error || '결과를 불러오지 못했습니다.');
        return;
      }
      renderTally(data);
    } catch (e) {
      if (id !== currentPoll) return;
      document.getElementById('totalLine').textContent = '⚠️ 네트워크 오류로 결과를 불러오지 못했습니다.';
    }
  }

  (function init() {
    // 다른 탭에서 입력한 이름을 미리 채워둠
    try {
      const savedName = localStorage.getItem(NAME_KEY);
      if (savedName) document.getElementById('voterName').value = savedName;
    } catch (e) {}

    // 관리자 주소(?key=...)로 들어오면 투표 없이 결과+이름 모니터링 화면
    if (ADMIN_KEY) {
      const banner = document.createElement('div');
      banner.className = 'admin-banner';
      banner.textContent = '🔒 관리자 모드 — 참여자 이름이 표시됩니다';
      const resultsCard = document.getElementById('results');
      resultsCard.insertBefore(banner, resultsCard.firstChild);
    }
    // 기본 링크로 들어오면 이미 투표한 탭을 먼저 열어서 결과가 바로 보이게 함
    if (!currentPoll) {
      currentPoll = POLL_IDS.find(id => hasVoted(id)) || POLL_IDS[0];
    }
    openPoll();
  })();

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      stopPolling();
    } else if (document.getElementById('results').classList.contains('show')) {
      startPolling();
    }
  });
</script>
</body>
</html>
